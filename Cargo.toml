[package]
name = "xmip-core-contract-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-contract-sql"
description = "SQL content contract: statements tokenize and split cleanly with balanced quotes, comments and parentheses, each beginning as SELECT, INSERT, UPDATE, DELETE, MERGE, DDL, DCL or TCL; a Location that names the statement kinds it allows holds every script to them. A xmip-core-contract technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Contract trait and its value types live there.
contract = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# contract::ContractFactory (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
stream = { workspace = true, optional = true }
# The character reader every lexer walks its text with.
codec = { workspace = true, optional = true }
# SQL: the delimited text a quoted run is read with, and the verbs a
# statement opens with, which the allowed set names.
sql = { workspace = true, optional = true }

[features]
# The code and its declaration: the contract guide,
# module/core/capability/contract/doc/adding-a-contract.md.
default = ["declaration", "dep:contract", "dep:stream", "dep:codec", "dep:sql"]
# The declaration alone.
declaration = []

[dev-dependencies]
# The parent's Stream fixture, for the tests only (ADR-0044).
contract = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
